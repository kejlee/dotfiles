[mgr]

ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = false
sort_translit = true
linemode = "size_and_mtime"
show_hidden = true
show_symlink = true
scrolloff = 100


[preview]

wrap = "yes"
tab_size = 2
#max_width = 50
#max_height = 100
#run ya cache clear after changing this
image_filter = "catmull-rom"
image_quality = 70

ueberzug_scale = 1
ueberzug_offset = [0.5, 0.5, -0.5, -0.5]

#finish everything later: https://yazi-rs.github.io/docs/configuration/yazi
